# Account-specific: apply with  envsubst < k8s/predict-service.yaml | kubectl apply -f -   (see scripts/argus_env.sh)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-predict-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-predict-service
  template:
    metadata:
      labels:
        app: argus-predict-service
    spec:
      containers:
        - name: predict-service
          image: ${ARGUS_ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com/argus/predict-service:latest
          imagePullPolicy: Always         # pull Person B's fixed :latest from ECR
          ports:
            - containerPort: 8000
          # No env overrides: MOCK_MODE was removed in Week 6, and MODEL_PATH here
          # pointed at the wrong path (/app/model.pt vs the app's /app/model/...).
          # The image's baked-in defaults for model + features are verified-correct.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: argus-predict-service
  namespace: default
spec:
  selector:
    app: argus-predict-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
