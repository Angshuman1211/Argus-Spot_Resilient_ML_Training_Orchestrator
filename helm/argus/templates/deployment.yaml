apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-operator
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: operator
          image: "{{ include "argus.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "controller.main"]
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          env:
            - name: METRICS_PORT
              value: "{{ .Values.metrics.port }}"
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws.region }}
            - name: CHECKPOINT_BUCKET
              value: {{ include "argus.checkpointBucket" . }}
            - name: RISK_EVENTS_QUEUE_URL
              value: {{ include "argus.riskEventsQueueUrl" . }}
            - name: PREDICT_SERVICE_URL
              value: {{ .Values.operator.predictServiceUrl }}
            - name: POLL_INTERVAL_SECONDS
              value: "{{ .Values.operator.pollIntervalSeconds }}"
            - name: RISK_THRESHOLD
              value: "{{ .Values.operator.riskThreshold }}"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
