image:
  repository: 844641713781.dkr.ecr.eu-north-1.amazonaws.com/argus/operator
  tag: latest
  pullPolicy: IfNotPresent

operator:
  pollIntervalSeconds: 60
  # Score threshold on the calibrated risk from the prediction service. 0.05 is the 10% alarm
  # budget for eu-north-1 on the calibration slice: alarm on roughly 10% of 5-minute steps, which
  # the trace benchmark found best for large checkpoints (docs/trace_benchmark_result.md). Lower it
  # for more recall and more checkpoints, raise it for fewer alarms. The old 0.65 and 0.0015
  # defaults belonged to earlier models.
  riskThreshold: 0.05
  predictServiceUrl: http://argus-predict-service:8000

metrics:
  # Port the operator's Prometheus client serves on (metrics.py start_http_server).
  port: 8080

aws:
  region: eu-north-1
  checkpointBucket: argus-checkpoints-844641713781
  riskEventsQueueUrl: https://sqs.eu-north-1.amazonaws.com/844641713781/argus-risk-events

serviceAccount:
  name: argus-operator
  irsaRoleArn: arn:aws:iam::844641713781:role/argus-operator-irsa

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
