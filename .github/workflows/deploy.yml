name: Build and Deploy Operator

on:
  push:
    branches: [master]
    paths:
      - "operator/**"
      - "helm/**"

env:
  AWS_REGION: eu-north-1
  # Repository variable AWS_ACCOUNT_ID (Settings > Secrets and variables > Actions > Variables)
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: argus/operator
  EKS_CLUSTER: argus-eks

jobs:
  deploy:
    runs-on: ubuntu-latest
    # OIDC: GitHub proves who it is and AWS hands back short-lived credentials. The role (created by
    # scripts/setup_github_oidc.sh) can be assumed only by workflows on this repo's master branch.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/argus-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push operator image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       operator/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # The cluster is normally torn down to $0 between sessions (see
      # docs/problems_and_decisions.md — the $66 lesson). Deploying against a
      # non-existent cluster would fail the whole run, so gate the deploy on the
      # cluster actually being up. Build+push above always runs; deploy is
      # best-effort.
      - name: Check EKS cluster exists
        id: cluster
        run: |
          if aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EKS cluster '$EKS_CLUSTER' not found — skipping Helm deploy (cluster torn down). Image was still built and pushed."
          fi

      - name: Update kubeconfig for EKS
        if: steps.cluster.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy via Helm
        if: steps.cluster.outputs.exists == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install argus ./helm/argus \
            --namespace default \
            --set aws.accountId=$AWS_ACCOUNT_ID \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m
