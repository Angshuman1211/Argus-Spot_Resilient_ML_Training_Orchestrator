name: Build and Deploy Operator

on:
  push:
    branches: [master]
    paths:
      - "operator/**"
      - "helm/**"

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 844641713781.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: argus/operator
  EKS_CLUSTER: argus-eks

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push operator image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       operator/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # The cluster is normally torn down to $0 between sessions (see
      # docs/problems_and_decisions.md — the $66 lesson). Deploying against a
      # non-existent cluster would fail the whole run, so gate the deploy on the
      # cluster actually being up. Build+push above always runs; deploy is
      # best-effort.
      - name: Check EKS cluster exists
        id: cluster
        run: |
          if aws eks describe-cluster --name "$EKS_CLUSTER" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EKS cluster '$EKS_CLUSTER' not found — skipping Helm deploy (cluster torn down). Image was still built and pushed."
          fi

      - name: Update kubeconfig for EKS
        if: steps.cluster.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy via Helm
        if: steps.cluster.outputs.exists == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install argus ./helm/argus \
            --namespace default \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m
