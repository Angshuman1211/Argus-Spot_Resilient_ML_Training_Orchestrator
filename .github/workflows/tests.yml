name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r operator/requirements.txt
          pip install pytest numpy pandas scikit-learn
      # Tests that need torch or the gitignored model artifacts skip themselves
      # (pytest.importorskip / skip), so this stays a fast, dependency-light check.
      - name: Run tests
        run: python -m pytest tests -q
