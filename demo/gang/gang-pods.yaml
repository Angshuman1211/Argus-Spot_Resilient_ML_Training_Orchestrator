---
apiVersion: v1
kind: Pod
metadata:
  name: gangtest-0
  namespace: default
  labels:
    argus.io/job: gangtest
spec:
  terminationGracePeriodSeconds: 5
  restartPolicy: Never
  affinity:
    podAntiAffinity:           # one member per node when it can, so a gang spans the cluster
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: {argus.io/job: gangtest}
  containers:
    - name: member
      image: registry.k8s.io/pause:3.9
