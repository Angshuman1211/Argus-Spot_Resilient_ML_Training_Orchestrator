# Account-specific: apply with  envsubst < demo/spotresilientjob.yaml | kubectl apply -f -   (see scripts/argus_env.sh)
apiVersion: argus.io/v1
kind: SpotResilientJob
metadata:
  name: cifar10-test
  namespace: default
spec:
  image: ${ARGUS_ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com/argus/training-job:latest
  checkpointPath: s3://argus-checkpoints-${ARGUS_ACCOUNT_ID}/checkpoints/cifar10-test
  # NOTE: 0.65 only makes sense against the mock predictor's 0-1 output range
  # (used for the Week 7 dashboard demo, docs/A6_observability.md). Against the
  # REAL model, whose calibrated scores top out around 0.0018, this never fires -
  # see docs/week7_model_evaluation.md. Set this to ~0.0015 (the model's own
  # best-F1 threshold) if pointing PREDICT_SERVICE_URL at the real predict-service.
  riskThreshold: 0.65
  instanceFallback:
    - m5.xlarge   # model has real features for this type + AZ (m5.large has none → 404)
    - c5.xlarge
