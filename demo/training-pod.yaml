# Account-specific: apply with  envsubst < demo/training-pod.yaml | kubectl apply -f -   (see scripts/argus_env.sh)
# Training pod for the SpotResilientJob "cifar10-test".
#
# You apply this once; the operator does not create it from scratch. It addresses the pod by its exact
# name (= the SpotResilientJob name) and label argus.io/job=cifar10-test. When risk > threshold it
# saves a cleaned copy of this pod, cordons its node, deletes it and recreates it from the copy, so the
# replacement lands on another node and train.py's load_checkpoint() resumes from the latest S3
# checkpoint instead of restarting from scratch.
#
# It is a bare Pod (not a Deployment/Job) because the operator targets that exact name; a controller
# would generate hashed pod names. To stop the job for good, delete the SpotResilientJob first.
apiVersion: v1
kind: Pod
metadata:
  name: cifar10-test
  namespace: default
  labels:
    argus.io/job: cifar10-test
spec:
  # Reuse the operator's IRSA-bound ServiceAccount: its role has S3 checkpoint
  # read/write, and its trust is scoped to this SA — so the pod can assume it to
  # load/save checkpoints without static credentials.
  serviceAccountName: argus-operator
  nodeSelector:
    workload: ml-training           # schedule onto the m7i-flex workload nodes
  restartPolicy: Never
  # Objective 1: on a REAL Spot reclaim the node drains and sends SIGTERM, then
  # SIGKILL after this window. train.py's SIGTERM handler flushes a checkpoint
  # to S3 — this must finish inside the 2-min Spot notice. 90s is ample.
  # (The Week 6 *simulated* path uses grace_period_seconds=0 = SIGKILL and does
  #  not rely on this; the real-reclaim path does.)
  terminationGracePeriodSeconds: 90
  volumes:
    - name: dataset          # shared between the init fetch and the trainer
      emptyDir: {}
  # Pre-seed CIFAR-10 from S3 (in-region, seconds) so train.py skips the slow
  # ~35-min toronto.edu download. One-time upload of the tar:
  #   aws s3 cp cifar-10-python.tar.gz s3://argus-checkpoints-${ARGUS_ACCOUNT_ID}/datasets/
  # Uses the pod's IRSA (argus-operator-irsa has s3:GetObject on the bucket).
  initContainers:
    - name: fetch-dataset
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sh", "-c", "aws s3 cp s3://argus-checkpoints-${ARGUS_ACCOUNT_ID}/datasets/cifar-10-python.tar.gz /app/data/cifar-10-python.tar.gz"]
      volumeMounts:
        - name: dataset
          mountPath: /app/data
  containers:
    - name: train
      image: ${ARGUS_ACCOUNT_ID}.dkr.ecr.eu-north-1.amazonaws.com/argus/training-job:latest
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: dataset      # torchvision finds the tar here, extracts, skips download
          mountPath: /app/data
      # AWS_ENDPOINT_URL intentionally left UNSET so boto3 hits real AWS.
      env:
        - name: S3_BUCKET       # must match the SpotResilientJob's checkpointPath bucket
          value: "argus-checkpoints-${ARGUS_ACCOUNT_ID}"
        - name: EPOCHS          # override baked-in 5 → long run so we can
          value: "30"           # interrupt mid-training for the migration demo
        - name: PYTHONUNBUFFERED # stream train.py logs live (no buffering)
          value: "1"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          memory: "4Gi"
