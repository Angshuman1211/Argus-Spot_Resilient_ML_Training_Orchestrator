apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: spotresilientjobs.argus.io
spec:
  group: argus.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, checkpointPath, riskThreshold, instanceFallback]
              properties:
                image:
                  type: string
                  description: Docker image for the training job
                checkpointPath:
                  type: string
                  pattern: "^s3://.+"
                  description: S3 URI where training job saves checkpoints (no trailing slash)
                riskThreshold:
                  type: number
                  minimum: 0.0
                  maximum: 1.0
                  description: Operator triggers checkpoint+migrate when the risk (see riskSignal) exceeds this
                riskSignal:
                  type: string
                  enum: [price, capacity]
                  default: price
                  description: >-
                    price = /predict, the price-spike model (threshold about 0.05 for a 10% alarm budget).
                    capacity = /reclaim_risk, the model trained on real reclaims from the AWS placement score and
                    the node's age (threshold about 0.16 for a 10% alarm budget)
                availabilityZone:
                  type: string
                  default: eu-north-1a
                  description: AZ passed to the prediction service
                instanceFallback:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Ordered list of fallback instance types if current node is evicted
                gang:
                  type: boolean
                  default: false
                  description: >-
                    Synchronous multi-node job: every pod labelled argus.io/job=<name> is one member. The risk of
                    each member's node is read, and when any crosses the threshold all members are flushed once,
                    deleted and recreated together, and only the risky nodes are cordoned
            status:
              type: object
              properties:
                lastRiskScore:
                  type: number
                  description: Most recent risk score from the prediction service
                lastCheckpointStep:
                  type: integer
                  description: Number of checkpoint triggers issued by the operator
                lastMigrationAt:
                  type: number
                  description: Unix time of the last completed migration, used for the cooldown
                retryCount:
                  type: integer
                  description: Consecutive Failed to Running retries
                cordonedNode:
                  type: string
                  nullable: true
                  description: Node this operator cordoned and has not yet released
                cordonedAt:
                  type: number
                  nullable: true
                  description: Unix time of the cordon
                podSnapshot:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                  description: Cleaned manifest of the training pod, used to recreate it after a migration
                podSnapshots:
                  type: array
                  nullable: true
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  description: Gang jobs only, one cleaned manifest per member
                cordonedNodes:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: Gang jobs only, the nodes this operator cordoned and has not yet released
                phase:
                  type: string
                  enum: [Pending, Running, Checkpointing, Migrating, Succeeded, Completed, Failed]
                  description: Current lifecycle phase of the job
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: RiskScore
          type: number
          jsonPath: .status.lastRiskScore
        - name: CheckpointStep
          type: integer
          jsonPath: .status.lastCheckpointStep
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: spotresilientjobs
    singular: spotresilientjob
    kind: SpotResilientJob
    shortNames:
      - srj
